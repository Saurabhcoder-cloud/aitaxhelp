name: TaxAIHelp CI Pipeline

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Security Vulnerability Audit
        run: npm audit --audit-level=high
        # Note: Validates known high/critical CVEs in dependencies without leaking tokens

      - name: Typecheck TypeScript
        run: npm run type-check

      - name: ESLint Code Quality
        run: npm run lint

      - name: Run Test Suite
        run: npm test

      - name: Production Next.js Build
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_APP_URL: https://taxaihelp.com
          NEXT_PUBLIC_SITE_URL: https://taxaihelp.com
